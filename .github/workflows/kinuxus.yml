name: Creating Rootfs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt update && sudo apt install -y xz-utils

      - run: |
          mkdir -p alpine-root
          wget -qO alpine-minirootfs.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz
          sudo tar -xzf alpine-minirootfs.tar.gz -C alpine-root
          rm alpine-minirootfs.tar.gz
          sudo cp /etc/resolv.conf alpine-root/etc/resolv.conf
          sudo cp bux-v1.c alpine-root/tmp/
          sudo chroot alpine-root /bin/sh -c "
            apk add curl wpa_supplicant build-base libarchive-dev curl-dev zstd-dev json-c-dev linux-headers
            cd /tmp
            wget -qO- https://oils.pub/download/oils-for-unix-0.37.0.tar.gz | tar -xz
            cd oils-for-unix-0.37.0 && ./configure && _build/oils.sh
            cp _bin/cxx-opt-sh/oils-for-unix /usr/local/bin/
            cd /tmp && rm -rf oils-for-unix-0.37.0
            gcc bux-v1.c -o /usr/local/bin/bux -larchive -lcurl -lzstd -lpthread -ljson-c
            rm /tmp/bux-v1.c
            apk del build-base libarchive-dev curl-dev zstd-dev json-c-dev linux-headers
            apk add libstdc++ libarchive curl zstd json-c
            adduser -D -s /usr/local/bin/oils-for-unix kinux
          "
          echo 'export PATH="/usr/local/bin:$PATH"' | sudo tee -a alpine-root/home/kinux/.profile
          sudo rm -rf alpine-root/var/cache/apk
          sudo tar -cJf kinux-rootfs-arm64.tar.xz -C alpine-root .
          mkdir -p artifacts
          sudo mv kinux-rootfs-arm64.tar.xz artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: kinux-rootfs-arm64
          path: artifacts/kinux-rootfs-arm64.tar.xz
