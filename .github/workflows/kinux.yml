name: Build Kinux ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt update && sudo apt install -y wpasupplicant xorriso isolinux squashfs-tools libarchive-dev libcurl4-openssl-dev libzstd-dev xz-utils

      - run: |
          cd /tmp
          wget -qO- https://oils.pub/download/oils-for-unix-0.37.0.tar.gz | tar -xz
          cd oils-for-unix-0.37.0
          ./configure && _build/oils.sh
          mkdir -p ~/.local/bin
          cp _bin/cxx-opt-sh/oils-for-unix ~/.local/bin/
          cd .. && rm -rf oils-for-unix-0.37.0
          export PATH="$HOME/.local/bin:$PATH"
          grep -q '.local/bin' ~/.bashrc || echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
          oils-for-unix --version

      - run: gcc bux.c -o bux -larchive -lcurl -lzstd -lpthread && sudo mv bux /usr/local/bin/bux

      - run: |
          mkdir -p iso-build
          wget -qO noble-root.tar.xz https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64-root.tar.xz
          sudo tar -xJf noble-root.tar.xz -C iso-build
          rm noble-root.tar.xz
          sudo cp /usr/local/bin/bux iso-build/usr/local/bin/
          sudo cp ~/.local/bin/oils-for-unix iso-build/usr/local/bin/
          sudo mount --bind /dev iso-build/dev
          sudo mount --bind /proc iso-build/proc
          sudo mount --bind /sys iso-build/sys
          sudo cp /etc/resolv.conf iso-build/etc/resolv.conf
          sudo chroot iso-build /bin/bash -c "
            apt update
            apt install -y linux-image-generic
            useradd -m -s /usr/local/bin/oils-for-unix kinux
          "
          sudo umount iso-build/dev
          sudo umount iso-build/proc
          sudo umount iso-build/sys
          echo 'export PATH="/usr/local/bin:$PATH"' | sudo tee -a iso-build/home/kinux/.bashrc
          sudo mksquashfs iso-build filesystem.squashfs -comp xz -noappend
          mkdir -p iso
          mv filesystem.squashfs iso/
          cp /usr/lib/ISOLINUX/isolinux.bin iso/
          cp /usr/lib/syslinux/modules/bios/ldlinux.c32 iso/
          printf 'DEFAULT linux\nLABEL linux\n  KERNEL /vmlinuz\n  APPEND initrd=/initrd.img boot=live toram\n' > iso/isolinux.cfg
          sudo cp iso-build/boot/vmlinuz-* iso/vmlinuz
          sudo cp iso-build/boot/initrd.img-* iso/initrd.img
          xorriso -as mkisofs -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin -c boot.cat -b isolinux.bin -no-emul-boot -boot-load-size 4 -boot-info-table -o kinux.iso iso

      - uses: actions/upload-artifact@v4
        with:
          name: kinux-iso
          path: kinux.iso
